openapi: 3.0.3
info:
  title: Universe of Ilm API
  version: 2.0.0
  description: Django REST Framework API using JWT bearer authentication.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health/:
    get:
      security: []
      responses:
        '200': {description: Service health}
  /auth/register/:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '201': {description: Account created with JWT tokens}
        '400': {description: Validation error}
  /auth/token/:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, description: Username or email}
                password: {type: string, format: password}
      responses:
        '200': {description: Access and refresh tokens}
        '401': {description: Invalid credentials}
  /auth/token/refresh/:
    post:
      security: []
      responses:
        '200': {description: Rotated access token}
  /auth/logout/:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: {type: string}
      responses:
        '204': {description: Refresh token blacklisted}
  /me/:
    get: {responses: {'200': {description: Current user}}}
    patch: {responses: {'200': {description: Updated profile}}}
  /me/questions/:
    get: {responses: {'200': {description: Current user's questions}}}
    post: {responses: {'201': {description: Draft question}}}
  /me/questions/{id}/:
    get: {responses: {'200': {description: Authorized question}}}
    post:
      description: Submit an explicit workflow action such as submit, withdraw, clarify, or change_consent.
      responses:
        '200': {description: Workflow transition}
        '409': {description: Workflow conflict}
  /fatwas/:
    get:
      security: []
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string, enum: [bn, en]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: scholar, in: query, schema: {type: integer}}
        - {name: methodology, in: query, schema: {type: string}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: Approved public fatwas}}
  /fatwas/{id}/:
    get:
      security: []
      responses: {'200': {description: Public fatwa}}
  /categories/:
    get: {security: [], responses: {'200': {description: Active categories}}}
  /methodologies/:
    get: {security: [], responses: {'200': {description: Active methodologies}}}
  /scholars/:
    get: {security: [], responses: {'200': {description: Approved scholars}}}
  /scholar/assignments/:
    get: {responses: {'200': {description: Scholar assignments}}}
  /scholar/questions/{id}/answer/:
    post: {responses: {'201': {description: Saved or submitted answer revision}}}
  /reviews/:
    get: {responses: {'200': {description: Review queue}}}
  /reviews/{revision_id}/{action}/:
    post: {responses: {'200': {description: Review decision}}}
  /moderation/questions/{id}/assign/:
    post: {responses: {'200': {description: Question assignment}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Register:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
